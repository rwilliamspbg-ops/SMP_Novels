name: Security Audit

on:
  schedule:
    - cron: '0 2 * * *'  # Daily at 2 AM UTC
  workflow_dispatch:      # Manual trigger

jobs:
  security-audit:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install backend dependencies
        working-directory: ./backend
        run: npm ci

      - name: Run npm audit (backend)
        working-directory: ./backend
        run: npm audit --audit-level=high || true

      - name: Install frontend dependencies
        working-directory: ./frontend
        run: npm ci

      - name: Run npm audit (frontend)
        working-directory: ./frontend
        run: npm audit --audit-level=high || true

      - name: Check for secrets in source code
        run: |
          echo "Running secret detection scan..."
          if grep -rE "(password|secret|key)\s*[:=]\s*['\"][^$'\"]{8,}" . 2>/dev/null \
             | grep -v ".git" | grep -v ".env" | grep -v "node_modules" | head -5; then
            echo "⚠️ Warning: Potential secrets found in source code"
          else
            echo "✅ No obvious secret patterns detected"
          fi

      - name: Check .env file security
        run: |
          if [ -f .env ]; then
            echo "⚠️ .env file exists in repo root — add it to .gitignore"
          else
            echo "✅ No .env file committed to repo root"
          fi

      - name: Dependency vulnerability review
        uses: actions/dependency-review-action@v4
        # Only available on push/PR events; skip on schedule
        if: github.event_name == 'pull_request'
