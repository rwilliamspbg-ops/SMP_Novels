name: PR CI

on:
  pull_request:
    branches: [ main ]

jobs:
  pr-checks:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Use Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: backend/package-lock.json

      - name: Prepare backend .env
        run: |
          if [ -f backend/.env.example ]; then
            cp backend/.env.example backend/.env
          else
            echo "backend/.env.example not found" && exit 1
          fi
          # Inject safe dummy values for required keys so check-env passes
          for k in JWT_SECRET DB_PASSWORD DB_HOST DB_NAME DB_USER FRONTEND_URL; do
            if grep -q "^${k}=" backend/.env; then
              val=$(grep "^${k}=" backend/.env | cut -d'=' -f2-)
              if [ -z "$val" ] || echo "$val" | grep -qE "CHANGE_ME|your_secure|change_this"; then
                sed -i -E "s|^(${k}=).*|\1ci_dummy|" backend/.env
              fi
            else
              echo "${k}=ci_dummy" >> backend/.env
            fi
          done

      - name: Backend - install & check env
        run: |
          cd backend
          npm ci
          npm run check-env

      - name: Backend - npm audit
        working-directory: ./backend
        run: npm audit --omit=dev || true

      - name: Frontend - install & audit
        run: |
          cd frontend
          npm ci
          npm audit --omit=dev || true
