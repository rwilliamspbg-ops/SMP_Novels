name: PR CI

on:
  pull_request:
    branches: [ main ]

jobs:
  pr-checks:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Use Node.js 18
        uses: actions/setup-node@v4
        with:
          node-version: '18'

      - name: Prepare .env
        run: |
          if [ -f .env.example ]; then cp .env.example .env; else echo ".env.example not found" && exit 1; fi

      - name: Backend - install & check env
        run: |
          cd backend
          npm ci
          npm run check-env

      - name: Backend - npm audit
        run: |
          npm audit --omit=dev || true
        working-directory: ./backend

      - name: Frontend - install & audit
        run: |
          cd frontend
          npm ci
          npm audit --omit=dev || true
