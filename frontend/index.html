<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cognoscent Echo - AI-Powered Interactive Novel Platform</title>
    
    <!-- Modern Font -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
    
    <!-- A2UI Framework -->
    <script src="https://cdn.jsdelivr.net/npm/@ai-ui/a2ui@1.3.0/dist/a2ui.min.js"></script>
    <!-- CopilotKit SDK -->
    <script src="https://cdn.jsdelivr.net/npm/@copilotkit/react-core@1.7.45/build/global/js/index.cjs.js"></script>
    
    <link rel="stylesheet" href="src/style.css?v=20260518">
</head>
<body class="saas-theme dark-mode">
    <!-- A2UI Container -->
    <div id="app" data-a2ui-render-target></div>
    
    <!-- CopilotKit Sidebar Agent -->
    <div id="copilot-sidebar"></div>
    
    <!-- AG-UI Runtime -->
    <script src="https://cdn.jsdelivr.net/npm/@ag-ui/runtime@1.2.0/dist/runtime.js"></script>

    <!-- MCP Apps Integration -->
    <script type="module">
        import { createMCPServer } from 'https://cdn.jsdelivr.net/npm/mcp-apps/dist/servers/index.mjs';
        
        const server = await createMCPServer();
        window.cognoscentMCP = server;
    </script>

    <!-- Custom UI Components -->
    <div class="a2ui-container">
        <!-- Header with CopilotAgent -->
        <header class="glass-header" data-copilot-agent="true">
            <div class="brand">
                <div class="logo-animation">
                    <svg viewBox="0 0 100 100" class="logo-icon">
                        <circle cx="50" cy="50" r="45" fill="none" stroke="#00ffcc" stroke-width="2"/>
                        <path d="M50 5 L90 35 V65 L50 95 L10 65 V35 L50 5 Z" fill="#00ffcc"/>
                    </svg>
                </div>
                <div class="brand-text">
                    <h1>Cognoscent</h1>
                    <span class="echo">ECHO</span>
                </div>
            </div>
            
            <!-- Live Metrics -->
            <div id="dashboard" class="glass-metrics">
                <div class="metric-card" data-a2ui-bindable-id="metrics.throughput">
                    <div class="metric-icon">⚡</div>
                    <span>TP: <span id="metric-throughput">0</span></span>
                </div>
                <div class="metric-card" data-a2ui-bindable-id="metrics.latency">
                    <div class="metric-icon">⏱️</div>
                    <span>LAT: <span id="metric-latency">0</span></span>
                </div>
                <div class="metric-card" data-a2ui-bindable-id="metrics.resilience">
                    <div class="metric-icon">🛡️</div>
                    <span>RES: <span id="metric-resilience">0</span></span>
                </div>
                <div class="metric-card" data-a2ui-bindable-id="metrics.energy">
                    <div class="metric-icon">⚡</div>
                    <span>NRG: <span id="metric-energy">0</span></span>
                </div>
            </div>
            
            <!-- AI Copilot Button -->
            <button class="copilot-trigger" data-copilot-action="toggleSidebar">
                <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                    <circle cx="12" cy="12" r="3"/>
                    <path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 0 1 0 2.83 2 2 0 0 1-2.83 0l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-2 2 2 2 0 0 1-2-2v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 0 1-2.83 0 2 2 0 0 1 0-2.83l.06-.06a1.65 1.65 0 0 0 .33-1.82 1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1-2-2 2 2 0 0 1 2-2h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 0 1 0-2.83 2 2 0 0 1 2.83 0l.06.06a1.65 1.65 0 0 0 1.82.33H9a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 2-2 2 2 0 0 1 2 2v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 0 1 2.83 0 2 2 0 0 1 0 2.83l-.06.06a1.65 1.65 0 0 0-.33 1.82V9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 2 2 2 2 0 0 1-2 2h-.09a1.65 1.65 0 0 0-1.51 1z"/>
                </svg>
            </button>
        </header>

        <!-- Authentication Overlay -->
        <div id="auth-container" class="glass-overlay">
            <div class="auth-glass-card">
                <h2 data-copilot-agent-label="Enter the Core">🔐 Enter the Core</h2>
                <form id="login-form" data-copilot-action="authenticate">
                    <div class="input-group">
                        <label for="username">Username</label>
                        <input type="text" name="username" id="username" 
                               placeholder="Enter your identifier" 
                               autocomplete="username" required
                               data-a2ui-bindable-id="auth.username">
                    </div>
                    <div class="input-group">
                        <label for="password">Password</label>
                        <input type="password" name="password" id="password" 
                               placeholder="••••••••" 
                               autocomplete="current-password" required
                               data-a2ui-bindable-id="auth.password">
                    </div>
                    <button type="submit" class="run-btn glow-pulse">Authenticate & Enter</button>
                    <p class="auth-hint" data-copilot-agent-description="This authenticates you to the interactive novel platform. Your progress will be tracked here, including learning outcomes and governance votes.</p>
                    </p>
                </form>
            </div>
        </div>

        <!-- Progress Dashboard -->
        <div id="progress-dashboard" class="glass-panel hidden">
            <h3 data-copilot-agent-label="Your Learning Journey">🎓 Learning Progress</h3>
            <div class="progress-grid">
                <div class="progress-card" data-a2ui-bindable-id="progress.totalChaptersCompleted">
                    <span class="progress-number">0</span>
                    <span class="progress-label">Chapters Completed</span>
                </div>
                <div class="progress-card" data-copilot-agent-count="skillsLearned.length">
                    <span class="progress-number">0</span>
                    <span class="progress-label">Skills Mastered</span>
                </div>
                <div class="progress-card" data-a2ui-bindable-id="progress.currentChapter">
                    <span class="progress-number">1</span>
                    <span class="progress-label">Current Chapter</span>
                </div>
            </div>
            <div id="skills-list" class="glass-panel-small" style="margin-top: 10px;">
                <!-- Skills will be loaded here -->
            </div>
        </div>

        <!-- Main Story Container with MCP Apps -->
        <main id="story-container" class="glass-content">
            <div id="chapter-header" class="glass-header-small"></div>
            
            <!-- Story Text with Typing Effect -->
            <div id="story-text" class="story-text typing-effect"></div>
            
            <!-- Interactive WASM Zone with A2UI Bindings -->
            <div id="interactive-zone" class="wasm-container hidden">
                <div class="wasm-header" data-copilot-agent-label="WASM Code Sandbox">
                    <h4>🔬 WASM Educational Sandbox</h4>
                    <div class="wasm-metrics" data-a2ui-bindable-id="sandbox.metrics"></div>
                </div>
                <div class="code-editor-container">
                    <textarea id="code-editor" 
                              class="wasm-editor" 
                              placeholder="// Write your Go code here...
import 'sync'
type FramePool struct {...}"
                              spellcheck="false"
                              data-a2ui-bindable-id="sandbox.code"></textarea>
                </div>
                <div class="wasm-actions" data-copilot-action-group="execute,validate,inspect">
                    <button id="run-code-btn" class="btn-primary glow-pulse">▶ Execute Code</button>
                    <button id="inspect-memory-btn" class="btn-secondary glow-pulse">🔍 Inspect Memory</button>
                    <button id="reset-code-btn" class="btn-tertiary glow-pulse">↺ Reset</button>
                </div>
                <div id="wasm-feedback" class="feedback-panel"></div>
            </div>

            <!-- Governance Voting Zone -->
            <div id="governance-zone" class="governance-container hidden">
                <h4 data-copilot-agent-label="Community Governance Vote">🗳️ Governance Proposal</h4>
                <div class="proposal-card" data-a2ui-bindable-id="governance.proposal">
                    <p id="proposal-text"></p>
                    <div id="voting-options" class="options-grid"></div>
                </div>
            </div>

            <!-- Choices with CopilotAgent for recommendations -->
            <div id="choices-container" class="choices-container hidden"></div>
        </main>

        <!-- AI Copilot Sidebar (AG-UI powered) -->
        <aside id="copilot-sidebar" class="glass-sidebar hidden">
            <div class="sidebar-header" data-copilot-agent-label="AI Copilot Assistant">
                <h3>Copilot Agent</h3>
                <button id="close-sidebar" class="btn-close">×</u>
            </div>
            
            <!-- AG-UI Chat Interface -->
            <div id="copilot-chat" class="chat-container">
                <div id="chat-messages"></div>
                <div id="chat-input-area" data-copilot-action="sendChatMessage">
                    <input type="text" id="copilot-input" 
                           placeholder="Ask the Copilot anything about this chapter..."
                           data-a2ui-bindable-id="copilot.query">
                    <button id="send-message-btn">Send</button>
                </div>
            </div>

            <!-- Learning Tips Panel -->
            <div id="learning-tips-panel" class="tips-panel hidden">
                <h4 data-copilot-agent-label="Learning Tips">💡 AI Learning Tips</h4>
                <div id="tips-content"></div>
            </div>

            <!-- Navigation Suggestions -->
            <div id="nav-suggestions" class="nav-suggestions hidden">
                <h4 data-copilot-agent-label="AI Navigation Suggestions">🧭 AI Suggests</h4>
                <div id="suggestion-list"></div>
            </div>
        </aside>

        <!-- WASM Feedback Panel -->
        <div id="wasm-feedback-panel" class="feedback-panel hidden"></div>
        
        <!-- Learning Outcomes Panel -->
        <div id="learning-outcomes-panel" class="glass-panel-small hidden">
            <h4 data-copilot-agent-label="Learning Outcomes">🎯 Learning Outcomes</h4>
            <div id="outcomes-list"></div>
        </div>
    </div>

    <!-- Load External Scripts -->
    <script src="src/CopilotExperience.jsx"></script>
    <script src="src/ai_nav_bridge.js"></script>
    <script src="src/bridge.js"></script>
    <script src="src/quantumSim.js"></script>
    <script src="src/governance.js"></script>
    
    <!-- Main Application Logic -->
    <script src="src/main.js?v=20260518"></script>
    
    <!-- A2UI Component Library -->
    <script>
        // Register A2UI components for the novel platform
        window.AppComponents = {
            NovelChapter: '<app-novel-chapter></app-novel-chapter>',
            WASMSandbox: '<app-wasm-sandbox></app-wasm-sandbox>',
            GovernanceVote: '<app-governance-vote></app-governance-vote>',
            LearningProgress: '<app-learning-progress></app-learning-progress>'
        };
    </script>

</body>
</html>
