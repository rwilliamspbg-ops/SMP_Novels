version: '3.8'

services:
  # PostgreSQL Database (Primary Data Store)
  postgres:
    image: postgres:15-alpine
    container_name: cognoscent-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${DB_USER:-postgres}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-postgres}
      POSTGRES_DB: ${DB_NAME:-interactive_novel}
    ports:
      - "${DB_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./backend/init-db.sql:/docker-entrypoint-initdb.d/init-scripts.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER:-postgres} -d ${DB_NAME:-interactive_novel}"]
      interval: 10s
      timeout: 5s
      retries: 5

  # Backend API Server (Fastify + PostgreSQL)
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile.prod
    container_name: cognoscent-backend
    restart: unless-stopped
    ports:
      - "3001:3001"
    environment:
      NODE_ENV: ${NODE_ENV:-production}
      PORT: 3001
      DB_HOST: postgres
      DB_PORT: 5432
      DB_NAME: ${DB_NAME:-interactive_novel}
      DB_USER: ${DB_USER:-postgres}
      DB_PASSWORD: ${DB_PASSWORD:-postgres}
      JWT_SECRET: ${JWT_SECRET:-$(openssl rand -hex 32)}
      RATE_LIMIT_MAX: ${RATE_LIMIT_MAX:-100}
      RATE_LIMIT_TIME_WINDOW: ${RATE_LIMIT_TIME_WINDOW:-1m}
      CORS_ORIGIN: ${CORS_ORIGIN:-*}
      FRONTEND_URL: ${FRONTEND_URL:-http://localhost:3000}
    depends_on:
      postgres:
        condition: service_healthy
    deploy:
      resources:
        limits:
          cpus: '2'
          memory: 512M

  # Frontend Web Server (Static + API Proxy)
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile.prod
    container_name: cognoscent-frontend
    restart: unless-stopped
    ports:
      - "3000:3000"
    depends_on:
      - backend
    deploy:
      resources:
        limits:
          cpus: '1'
          memory: 256M

volumes:
  postgres_data:
    driver: local

# Note: Redis and monitoring services are optional
# Add them back by uncommenting sections in docker-compose.prod.yml
# or using separate docker-compose.monitoring.yml file
